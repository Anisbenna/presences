name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, principal ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installer les dépendances système
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip autoconf automake libtool \
          pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev build-essential ccache \
          python3-pip python3-venv

    - name: Installer Buildozer et Cython
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install buildozer cython==0.29.36

    - name: Afficher la config
      run: |
        echo "=== buildozer.spec ==="
        cat buildozer.spec
        echo "=== Version Java ==="
        java -version

    - name: Compiler l'APK
      run: |
        yes | buildozer -v android debug

    - name: Uploader l'APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: apk-package
        path: bin/*.apk
        if-no-files-found: warn
